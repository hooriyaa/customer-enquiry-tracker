<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="3" y1="2" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Container with rounded corners and gold border -->
  <rect width="32" height="32" rx="7" fill="url(#bgGradient)" stroke="url(#goldBorder)" stroke-width="1" />

  <!-- Hexagonal Shield Facet -->
  <polygon
    points="16,5 26,10 26,22 16,27 6,22 6,10"
    stroke="url(#goldGradient)"
    stroke-width="1.2"
    stroke-linejoin="round"
    fill="#0F172A"
    fill-opacity="0.5"
  />

  <!-- Neural Interlock Lines -->
  <line x1="16" y1="5" x2="16" y2="27" stroke="url(#goldGradient)" stroke-width="0.7" stroke-opacity="0.4" />
  <line x1="6" y1="10" x2="26" y2="22" stroke="url(#goldGradient)" stroke-width="0.7" stroke-opacity="0.3" />
  <line x1="6" y1="22" x2="26" y2="10" stroke="url(#goldGradient)" stroke-width="0.7" stroke-opacity="0.3" />

  <!-- Classic Serif 'I' Monogram -->
  <path
    d="M12.5 10.5H19.5M16 10.5V21.5M12.5 21.5H19.5"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Golden Node Accents -->
  <circle cx="16" cy="5" r="1.3" fill="#F59E0B" />
  <circle cx="26" cy="10" r="1.3" fill="#F59E0B" />
  <circle cx="26" cy="22" r="1.3" fill="#F59E0B" />
  <circle cx="16" cy="27" r="1.3" fill="#F59E0B" />
  <circle cx="6" cy="22" r="1.3" fill="#F59E0B" />
  <circle cx="6" cy="10" r="1.3" fill="#F59E0B" />
  <circle cx="16" cy="16" r="1.5" fill="#F59E0B" />
</svg>
